# Hiera-L affinity 尾训控制臂：从语义恢复 e20 出发，仅继续训练 affinity decoder。
_base: direct_ssl_semantic_affinity_hiera_l.yaml

paths:
  output_dir: outputs/direct_ssl_semantic_affinity_hiera_l_affinity_tail_control

direct_semantic_affinity:
  output_dir: outputs/direct_ssl_semantic_affinity_hiera_l_affinity_tail_control
  checkpoint_interval: 10

  affinity_recovery:
    enabled: true
    init_from_checkpoint: outputs/direct_ssl_semantic_affinity_hiera_l_e31_semantic_recovery/checkpoint_epoch_0020.pth
    epochs: 10
    learning_rate: 1.0e-5
    minimum_learning_rate: 1.0e-6
    loss_calibration_batches: 4

  monitor:
    enabled: true
    # 短程实验至少保留约 5 个时间点：ceil(10 / 5) = 2。
    interval: 2
    image_dir: data/unlabeled
    manifest: config/monitor/unlabeled_holdout_v1.txt
    num_images: 10
    output_dir: outputs/direct_ssl_semantic_affinity_hiera_l_affinity_tail_control/monitor

  deployment_validation:
    boundary_threshold: 0.59

inference:
  boundary_threshold: 0.59
