# E8: geometry-isolated semantic residual training from the proven V6 anchor.
# Only the zero-initialized residual adapter is trainable. G4b affinity keeps
# consuming the byte-identical V6 encoder/LoRA features.
_base: stage2_semantic_e7b_decoder20.yaml

decoder:
  semantic_residual: true
  semantic_residual_hidden: 64
  semantic_residual_color_channels: 16
  semantic_residual_use_photometric: true
  semantic_residual_max_logit_delta: 2.0

train:
  seg_dice_weight: 0.25
  semantic_instance_weight: 0.75
  # Mild recall trend, not a one-way classifier: pearlite errors still retain
  # full BCE/Tversky/instance supervision.
  semantic_instance_ferrite_weight: 1.15
  semantic_instance_hard_gamma: 1.5
  semantic_instance_hard_floor: 0.35
  semantic_tversky_weight: 0.15
  semantic_tversky_alpha: 0.40
  semantic_tversky_beta: 0.60

semi_supervised:
  output_dir: outputs/stage2_semantic_e8_residual20
  epochs: 20
  learning_rate: 8.0e-5
  seg_lr_ratio: 1.0
  unsup_seg_weight: 0.03
  unsup_rampup_epochs: 4
  unsup_seg_confidence_threshold: 0.82
  semantic_residual_training:
    enabled: true
  monitor:
    image_dir: data/unlabeled
    manifest: config/monitor/unlabeled_holdout_v1.txt
    num_images: 10
    output_dir: outputs/stage2_semantic_e8_residual20/monitor

progressive_aug:
  enabled: true
  policy: physical_v1
  start_epoch: 0
  ramp_epochs: 3
  max_prob: 0.80
  min_ops: 1
  max_ops: 2
  op_weights:
    dark_rim: 1.2
    gamma: 1.5
    white_balance: 1.2
    gaussian_blur: 0.6
    downsample: 0.4
    illumination: 1.5
    scratch: 0.2
    noise: 0.0
  gamma_range: [0.65, 1.45]
  white_balance_range: [0.88, 1.12]
  blur_sigma_range: [0.3, 1.4]
  blur_kernel_size: 9
  downsample_scale_range: [0.65, 0.95]
  illumination_strength: 0.20
  illumination_grid: 3
  scratch_count_range: [1, 2]
  scratch_width_range: [0.6, 1.6]
  scratch_opacity_range: [0.02, 0.06]
  dark_rim_width_range: [2, 6]
  dark_rim_opacity_range: [0.08, 0.25]
  dark_rim_boundary_threshold: 0.20
  gaussian_noise_std: 0.0
