# E7b-A: semantic-only repair from the proven V6 checkpoint.
# G4b affinity geometry and all watershed thresholds stay outside this run.
_base: ../default_config.yaml

decoder:
  boundary_refine: false
  center_head: false

data:
  crop_size: 512
  native_multiscale:
    enabled: false

lora:
  enabled: true
  freeze: true
  lr_ratio: 0.0

train:
  amp: true
  seg_dice_weight: 0.30
  semantic_instance_weight: 0.50
  semantic_core_radius: 3
  semantic_core_min_pixels: 12
  semantic_core_boundary_threshold: 0.20
  semantic_instance_class_balance: true
  composite_sem_weight: 1.0
  composite_boundary_weight: 0.0

semi_supervised:
  base_checkpoint: outputs/stage2_v6/best_model_stage2.pth
  init_from_checkpoint: ""
  output_dir: outputs/stage2_semantic_e7b_decoder20
  use_unlabeled: true
  use_cached_pseudo_labels: false
  boundary_teacher_mode: ema
  boundary_anchor:
    enabled: false
  epochs: 20
  learning_rate: 3.0e-5
  seg_lr_ratio: 1.0
  boundary_lr_ratio: 0.0
  lr_schedule: flat_decay
  warmup_epochs: 1
  warmup_start_factor: 0.25
  flat_epochs: 12
  decay_end_factor: 0.25
  batch_size_labeled: 4
  batch_size_unlabeled: 4
  labeled_steps_per_epoch: 62
  unlabeled_samples_per_epoch: 248
  unsup_weight: 0.0
  unsup_seg_weight: 0.05
  unsup_rampup_epochs: 4
  unsup_seg_sharpen_temperature: 0.70
  unsup_seg_confidence_threshold: 0.85
  enable_patch_mask: false
  seg_mask_region_weight: 1.0
  checkpoint_interval: 5
  monitor:
    image_dir: data/unlabeled
    manifest: config/monitor/unlabeled_holdout_v1.txt
    num_images: 10
    output_dir: outputs/stage2_semantic_e7b_decoder20/monitor
  freeze:
    seg_branch: false
    boundary_branch: true
  sem_boundary_align_weight: 0.0
  skeleton_filter:
    enabled: false
  diagnostics:
    enabled: true
    save_initial_monitor: true

progressive_aug:
  enabled: true
  policy: physical_v1
  start_epoch: 0
  ramp_epochs: 3
  max_prob: 0.65
  min_ops: 1
  max_ops: 2
  op_weights:
    dark_rim: 1.6
    gamma: 1.0
    white_balance: 0.9
    gaussian_blur: 0.8
    downsample: 0.8
    illumination: 0.7
    scratch: 0.35
    noise: 0.0
  gamma_range: [0.78, 1.28]
  white_balance_range: [0.92, 1.08]
  blur_sigma_range: [0.3, 1.6]
  blur_kernel_size: 9
  downsample_scale_range: [0.60, 0.95]
  illumination_strength: 0.12
  illumination_grid: 3
  scratch_count_range: [1, 3]
  scratch_width_range: [0.6, 1.8]
  scratch_opacity_range: [0.02, 0.08]
  dark_rim_width_range: [2, 6]
  dark_rim_opacity_range: [0.10, 0.30]
  dark_rim_boundary_threshold: 0.20
  gaussian_noise_std: 0.0
