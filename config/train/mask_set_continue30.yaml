# 共同起点e120，新的30轮低学习率阶段；不加入一致性的同预算对照。
_base: mask_set_teacher249_ownership.yaml

mask_set:
  output_dir: outputs/mask_set_continue30
  minimum_learning_rate: 0.0000001
  learning_rates:
    joint_decoder: 0.000005
    joint_lora: 0.000001
  continuation:
    checkpoint: outputs/20260910_teacher249_ab/teacher_ownership/best_joint.pth
    epochs: 30
    pseudo_source: outputs/datasets/mainline_maskset249_v1
    evaluation_excluded_names: [train_889]
  pseudo:
    dataset_dir: outputs/consistency_data/mainline_maskset_disjoint_v2
  consistency:
    weight: 0.0
    image_dir: data/unlabeled
    holdout_file: config/monitor/unlabeled_holdout_v1.txt
    every_n_steps: 4
    ema_decay: 0.999
    ramp_epochs: 5
    iou_threshold: 0.8
    mask_confidence: 0.7
    seed: 20260911
