_base: ../inference/v6_reference.yaml

affinity_geometry:
  reference_checkpoint: outputs/stage2_v6/best_model_stage2.pth
  output_dir: outputs/affinity_geometry_g0
  input_size: 1024
  output_grid: 512
  fpn_channels: 256
  up_channels: 128
  init_from_v6_boundary_fpn: true

  sample_names: [train_001, train_002]
  batch_size: 1
  cache_in_memory: true
  max_steps: 400
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  amp: true
  seed: 42

  semantic_tolerance: 1.0e-6
  log_interval: 20
  monitor_interval: 100
  checkpoint_interval: 200
