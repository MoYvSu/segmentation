# 训练预算对照：同 seed 从头训练80轮；余弦学习率周期随预算放缓。
_base: rgb_restoration_deblur_v3.yaml

rgb_restoration:
  output_dir: outputs/rgb_restoration_deblur_v3_long80
  train:
    epochs: 80
    save_epochs: [6, 20, 40, 60, 80]
  diagnostics:
    # 固定保留图的中心512裁块；仅记录，不参与损失、选优或训练采样。
    local_damage:
      seed_epoch: 5
      strength: 1.0
      affected_threshold: 0.1
      mask:
        patch_size: [16, 48]
        coverage: [0.08, 0.16]
        lowpass_sigma: [6.0, 12.0]
        blend: [0.65, 0.95]
