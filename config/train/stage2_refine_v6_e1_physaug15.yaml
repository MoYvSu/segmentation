# E1 PhysAug-15：在纯 refine 已进入平台期后，引入显微成像物理外观增强。
# 从 Continue-15 best 初始化；只训练 refine head，不改损失、不解冻 coarse/semantic/LoRA。
# 每个样本最多抽取 1~2 项外观退化，保留 40% 干净样本，不改变 GT 几何。
_base: stage2_refine_v6_stage0_continue15.yaml

inference:
  output_dir: outputs/inference_refine_v6_e1_physaug15
  stage2_checkpoint: outputs/stage2_refine_v6_e1_physaug15/best_model_stage2.pth

semi_supervised:
  output_dir: outputs/stage2_refine_v6_e1_physaug15
  init_from_checkpoint: outputs/stage2_refine_v6_stage0_continue15/best_model_stage2.pth
  epochs: 15
  learning_rate: 1.0e-5
  warmup_epochs: 0
  flat_epochs: 8
  decay_end_factor: 0.25
  labeled_steps_per_epoch: 62
  checkpoint_interval: 5
  monitor:
    image_dir: data/raw
    num_images: 10
    output_dir: outputs/stage2_refine_v6_e1_physaug15/monitor
  refine_training:
    enabled: true
    refine_only_epochs: 15
    refine_lr_ratio: 1.0
    boundary_base_lr_ratio: 0.15
  diagnostics:
    enabled: true
    save_initial_monitor: true

progressive_aug:
  enabled: true
  policy: physical_v1
  start_epoch: 0
  ramp_epochs: 2
  max_prob: 0.60
  min_ops: 1
  max_ops: 2
  op_weights:
    gamma: 1.0
    white_balance: 0.7
    gaussian_blur: 1.2
    downsample: 1.0
    illumination: 0.8
    scratch: 0.35
    noise: 0.0
  gamma_range: [0.75, 1.35]
  white_balance_range: [0.92, 1.08]
  blur_sigma_range: [0.3, 2.0]
  blur_kernel_size: 9
  downsample_scale_range: [0.50, 0.95]
  illumination_strength: 0.15
  illumination_grid: 3
  scratch_count_range: [1, 3]
  scratch_width_range: [0.6, 1.8]
  scratch_opacity_range: [0.02, 0.10]
  gaussian_noise_std: 0.0
