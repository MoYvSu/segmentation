# -*- coding: utf-8 -*-
# Dual-CGB恢复分支的独立候选；不改变现有后端，不实现迭代或未连接扩展回退。
_base: ../default_config.yaml
boundary_naf:
  output_dir: outputs/naf_boundary
  manifest: output/boundary_naf/assets/processed_gt32.json
  expected_sources: 32
  seed: 20261026
  model:
    width: 48
    encoder_blocks: [1, 1, 2, 4]
    middle_blocks: 2
    decoder_blocks: [1, 1, 1, 1]
  discriminator:
    width: 64
  data:
    crop_size: 256
    stride: 50
    augmentations: 8
    samples_per_epoch: 16000
    identity_probability: 0.2
    boundary_dilation: 0
    valid_margin: 4
    crop_margin: 4
    gap_count_range: [1, 4]
    gap_length_range: [8, 40]
    gap_half_width_range: [3, 5]
  training:
    # 先做阶段检查；不能将此预算称为论文约53000次主训的完整复现。
    main_updates: 5000
    topology_updates: 1000
    main_schedule_updates: 53000
    topology_schedule_updates: 10600
    segment_updates: 1000
    effective_batch_size: 16
    micro_batch_size: 16
    learning_rate: 0.001
    topology_learning_rate: 0.0001
    minimum_lr_ratio: 0.01
    adam_betas: [0.9, 0.999]
    adam_eps: 0.00000001
    grad_clip: 1.0
    bce_weight: 1.0
    adversarial_weight: 1.0
    topology_weight: 0.001
    num_workers: 4
    prefetch_factor: 2
    torch_threads: 4
    opencv_threads: 1
    precision: float32
    checkpoint_every_updates: 250
    log_every_updates: 25
  topology:
    tile_size: 192
    max_tiles_per_image: 1
    min_persistence: 0.01
    border_margin: 2
    stride: 32
    max_pred_features: 256
    target_cache_size: 512
  inference:
    # 原文为二值晶界；显式记录接口适配，另报adapter-only以隔离阈值影响。
    input_mode: binary
    input_threshold: 0.5
    tile_size: 256
    overlap: 64
    reflect_pad: 32
    batch_size: 16
    iterations: 1
    revert_unconnected: false
  monitor:
    pair_indices: [0, 5, 17, 29, 41, 63]
    thumbnail_width: 280
    source_names: [test_101, test_116, test_166, test_169]
    control_manifests: []
    roi_spec: null
    full_readout_steps: [0, 1000, 3000, 5000, 6000]
