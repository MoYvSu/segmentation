# 唯一候选差异：原空间模糊的一半改为可见弱端/强端的平滑过渡。
# 总样本期望20% identity、40% uniform、20% oldspatial、20% endpoint。
_base: rgb_diffusion_d5a_control.yaml
rgb_restoration:
  output_dir: outputs/d5a/candidate
  degradation:
    spatial_blur:
      endpoint_transition:
        enabled: true
        probability: 0.5
        weak_sigma: [0.6, 1.5]
        strong_sigma: [4.0, 5.2]
        transition_fraction: [0.2, 0.5]
        min_region_fraction: 0.05
