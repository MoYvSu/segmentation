# =============================================================================
# 低碳钢金相图像无监督相区分割 - 全局配置（双任务距离场版本）
# =============================================================================
# python 环境: conda activate sam2_env
# 架构变更：彻底放弃三分类，改用二分类Mask + 连续距离场回归双任务管线

# -----------------------------------------------------------------------------
# 路径配置
# -----------------------------------------------------------------------------
paths:
  # 项目根目录（自动推断为本文件上级目录）
  project_root: &project_root "d:/MY_PROGRAMME/segmentationv2"
  # 原始数据目录：存放图像与同名 labelme .json
  raw_data_dir: "data/raw"
  # 本地权重目录：所有第三方权重必须放在此目录下（禁止依赖 ~/.cache）
  weights_dir: "weights"
  # SAM 2 底座权重文件名
  sam2_ckpt: "sam2_hiera_base_plus.pt"
  # 训练输出目录
  output_dir: "outputs"
  # 伪标签输出目录
  pseudo_label_dir: "outputs/pseudo_labels"
  # 主动学习筛选记录
  active_learning_log: "outputs/active_learning_log.csv"

# -----------------------------------------------------------------------------
# SAM 2 Encoder 配置
# -----------------------------------------------------------------------------
sam2:
  # 模型版本：sam2_hiera_base_plus / sam2_hiera_large
  model_version: "sam2_hiera_base_plus"
  # Hydra 配置文件名（相对 sam2 包 configs 目录）
  config_file: "configs/sam2/sam2_hiera_b+.yaml"
  # 设备
  device: "cuda"
  # 显式冻结 encoder
  freeze: true
  # 本地 segment-anything-2 仓库路径（用于 import sam2）
  sam2_repo_path: "segment-anything-2"

# -----------------------------------------------------------------------------
# FPN 解码头配置（双任务距离场版本：输出 2 通道 = 分类 logits + 距离场回归）
# -----------------------------------------------------------------------------
decoder:
  # FPN 统一通道数（增强型：残差块 + 语义平滑头，参数量 ~6.3M）
  fpn_channels: 256
  # 输出通道数：固定为 2（通道0=分类logits, 通道1=距离场回归）
  num_classes: 2
  # 是否使用 dropout
  dropout: 0.1
  # 是否使用批量归一化
  use_bn: true

# -----------------------------------------------------------------------------
# 数据管道配置
# -----------------------------------------------------------------------------
data:
  # 输入图像长边目标尺寸（Letterbox）
  image_size: 1024
  # 铁素体晶界收缩像素数（已废弃，保留参数兼容性）
  erode_pixels: 5
  # 距离场非线性缩放因子: dist_norm = dist / (dist + scale_factor)
  dist_scale_factor: 10.0
  # 类别定义（二分类）
  classes:
    0: "pearlite"   # 珠光体
    1: "ferrite"    # 铁素体（核+晶界统一为前景）
  # 训练集占比
  train_ratio: 0.8
  # 随机种子
  seed: 42
  # DataLoader 参数
  batch_size: 4
  num_workers: 4
  # 数据增强
  augmentation:
    horizontal_flip: true
    vertical_flip: true
    rotation: true

# -----------------------------------------------------------------------------
# 训练配置
# -----------------------------------------------------------------------------
train:
  # 初始学习率
  learning_rate: 1.5e-4
  # 权重衰减
  weight_decay: 1.0e-4
  # 训练轮数
  epochs: 500
  # 学习率调度器
  scheduler: "cosine"
  # warmup 轮数
  warmup_epochs: 25
  # 梯度裁剪
  grad_clip: 0.3
  # 混合精度训练（暂时关闭，回退至FP32）
  amp: false
  # 距离场回归损失权重（BCE + dist_weight * MSE）
  dist_weight: 5.0
  # 保留checkpoints
  save_checkpoints: true

# -----------------------------------------------------------------------------
# 推理配置
# -----------------------------------------------------------------------------
inference:
  # 测试图像目录
  test_dir: "data/smoketest"
  # 输出目录
  output_dir: "outputs/inference"
  # 二分类阈值
  threshold: 0.5
  # 拓扑后处理最小实例面积过滤（像素）
  min_instance_area: 50
  # 实例 ID 上限（uint8）
  max_instance_id: 255

# -----------------------------------------------------------------------------
# 主动学习配置
# -----------------------------------------------------------------------------
active_learning:
  # 采样策略：entropy / boundary_variance
  strategy: "entropy"
  # 每轮采样数量
  sample_size: 10
  # 信息熵阈值
  entropy_threshold: 0.5
  # 边界方差阈值
  boundary_variance_threshold: 0.1

# -----------------------------------------------------------------------------
# 后处理配置
# -----------------------------------------------------------------------------
post_process:
  # 动态上采样插值模式
  interpolate_mode: "bilinear"
  align_corners: true
  # 连通域分析参数
  connectivity: 8
  # 噪点面积过滤
  min_noise_area: 50