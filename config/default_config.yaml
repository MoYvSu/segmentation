# =============================================================================
# 低碳钢金相图像无监督相区分割 - 全局配置（边界预测版本）
# =============================================================================
# python 环境: conda activate sam2_env
# 架构变更：双通道边界预测（语义掩码 + 晶界掩码）+ 离线边界净化

# -----------------------------------------------------------------------------
# 路径配置
# -----------------------------------------------------------------------------
paths:
  project_root: &project_root "d:/MY_PROGRAMME/segmentationv2"
  raw_data_dir: "data/raw"
  weights_dir: "weights"
  sam2_ckpt: "sam2_hiera_base_plus.pt"
  output_dir: "outputs/stage1"
  pseudo_label_dir: "outputs/pseudo_labels"
  active_learning_log: "outputs/active_learning_log.csv"

# -----------------------------------------------------------------------------
# SAM 2 Encoder 配置
# -----------------------------------------------------------------------------
sam2:
  model_version: "sam2_hiera_base_plus"
  config_file: "configs/sam2/sam2_hiera_b+.yaml"
  device: "cuda"
  freeze: true
  sam2_repo_path: "segment-anything-2"

# -----------------------------------------------------------------------------
# FPN 解码头配置（边界预测版本：输出 2 通道 = 语义 logits + 边界 logits）
# -----------------------------------------------------------------------------
decoder:
  fpn_channels: 256
  num_classes: 2
  dropout: 0.1
  use_bn: true

# -----------------------------------------------------------------------------
# 数据管道配置
# -----------------------------------------------------------------------------
data:
  image_size: 1024
  crop_size: 512
  erode_pixels: 5
  dist_scale_factor: 10.0
  classes:
    0: "pearlite"
    1: "ferrite"
  train_ratio: 0.8
  seed: 42
  batch_size: 4
  num_workers: 4
  augmentation:
    horizontal_flip: true
    vertical_flip: true
    rotation: true

# -----------------------------------------------------------------------------
# 训练配置
# -----------------------------------------------------------------------------
train:
  learning_rate: 1.5e-4
  weight_decay: 1.0e-4
  epochs: 100
  scheduler: "cosine"
  warmup_epochs: 25
  grad_clip: 1.0
  amp: false
  focal_gamma: 2.0
  focal_alpha: 0.75
  boundary_alpha: 3.0
  # 复合评分权重（best_model 保存依据）
  composite_sem_weight: 0.2
  composite_boundary_weight: 0.8
  save_checkpoints: true

# -----------------------------------------------------------------------------
# 边界净化与 EDT 权重配置
# -----------------------------------------------------------------------------
boundary:
  gt_dir: "data/purified_gt"
  purify_erode_radius: 2
  purify_dilate_width: 2
  purify_canny_low: 30
  purify_canny_high: 100
  edt_scale_factor: 10.0
  edt_weight_floor: 1.0
  edt_weight_ceil: 4.0

# -----------------------------------------------------------------------------
# 推理配置
# -----------------------------------------------------------------------------
inference:
  test_dir: "data/test"
  output_dir: "outputs/inference"
  threshold: 0.5
  min_instance_area: 500
  max_instance_id: 255
  # 双阈值滞后二值化（Canny 式）：boundary_threshold 为弱阈值，
  # boundary_threshold_high 为强阈值；弱阈值像素仅在与强阈值连通时保留。
  # 解决"单阈值压到 0.4 才可靠"的欠分割：弱真实边界保留、孤立噪声剔除。
  boundary_threshold: 0.4
  boundary_threshold_high: 0.6
  # 推理时对边界 logits 乘系数再 sigmoid（>1 增强弱响应，默认 1.0 不缩放）
  boundary_logit_scale: 1.0
  # 推理 TTA（hflip/vflip/rot180 平均），提升弱边界召回与稳定性
  tta: false
  watershed_dilate_width: 1
  checkpoint_stage: "stage2"
  stage1_checkpoint: "outputs/stage1/best_model.pth"
  stage2_checkpoint: "outputs/stage2/stage2_epoch100.pth"

# -----------------------------------------------------------------------------
# 主动学习配置
# -----------------------------------------------------------------------------
active_learning:
  strategy: "entropy"
  sample_size: 10
  entropy_threshold: 0.5
  boundary_variance_threshold: 0.1

# -----------------------------------------------------------------------------
# 后处理配置
# -----------------------------------------------------------------------------
post_process:
  interpolate_mode: "bilinear"
  align_corners: true
  connectivity: 8
  min_noise_area: 50
  save_visualization: false

# -----------------------------------------------------------------------------
# 半监督配置（Stage 2: Mean Teacher）
# -----------------------------------------------------------------------------
semi_supervised:
  # 无标注数据目录
  unlabeled_dir: "data/unlabeled"
  # 输出目录（第二阶段 checkpoints）
  output_dir: "outputs/stage2"

  # 从指定 checkpoint 初始化 decoder 权重（仅加载权重，重置 optimizer/scheduler/epoch）
  # 用于分支切换：训练完一个分支后，从此 checkpoint 开始训练另一个分支
  # 也可通过 CLI 参数 --init_from_checkpoint 覆盖
  # 留空=禁用，填路径=启用（如 "outputs/stage2/best_model_stage2.pth"）
  init_from_checkpoint: "outputs/stage2/best_seg_model/stage2_epoch50.pth"
  
  # EMA 衰减系数（基础值，启用 adaptive_ema 时根据当前 LR 动态调整）
  ema_decay: 0.996
  # 是否启用自适应 EMA 衰减（LR 高时降低 decay 让教师更快跟随，LR 低时提高 decay 增加稳定性）
  adaptive_ema: false
  # 边界伪标签源模式（实验对比用）
  # "ema": EMA 教师伪标签 + Stage-1 锚点混合（默认，当前行为）
  # "stage1_direct": 直接使用 Stage-1 冻结模型输出作为伪标签（无 EMA 滞后）
  # "self_consistency": 学生弱增强预测（stop-gradient）作为伪标签（无 EMA 依赖）
  boundary_teacher_mode: "stage1_direct"
  # stage1_direct 离线伪标签缓存（推荐）：
  # 先运行 tools/precompute_pseudo_labels.py 生成 Stage-1 边界目标缓存，
  # 训练时直接从缓存读取，免去每 step 的 ref_model 前向，
  # 并可对无边界响应的低质量无标签图做剔除（exclude.txt）。
  use_cached_pseudo_labels: true
  pseudo_label_cache_dir: "outputs/pseudo_labels/stage1_boundary"
  
  # 无监督损失权重
  unsup_weight: 0.3
  # 无监督权重 sigmoid ramp-up 长度（epoch 数，前 N 个 epoch 从 0 渐进到 unsup_weight）
  # 解决训练初期教师伪标签不可靠的问题
  unsup_rampup_epochs: 10
  # 训练轮数
  epochs: 100
  # 学习率
  learning_rate: 5.0e-5
  # 语义分支学习率比例（seg lr = seg_lr_ratio * learning_rate）
  seg_lr_ratio: 0.1
  # 边界分支学习率比例（boundary lr = boundary_lr_ratio * learning_rate）
  # 冻结语义分支后，所有可训练参数都在边界组，分层比例只会把唯一训练组
  # 压到 1e-6 量级，导致边界头"看起来在训、实际不动"（max 逼近1但gap不变）。
  # 因此置为 1.0（boundary lr = learning_rate = 5e-5）。
  boundary_lr_ratio: 1.0
  
  # 学习率调度模式："cosine"（旧余弦退火）或 "flat_decay"（新三阶段：warmup→恒定→温和衰减）
  lr_schedule: "flat_decay"
  # warmup 轮数
  warmup_epochs: 5
  # warmup 起始学习率比例（lr = warmup_start_factor * base_lr）
  warmup_start_factor: 0.01
  
  # cosine 衰减终点学习率比例（lr = cosine_end_factor * base_lr）[仅 lr_schedule=cosine 时生效]
  cosine_end_factor: 0.0
  # 恒定阶段长度（epoch 数，warmup 之后）[仅 lr_schedule=flat_decay 时生效]
  flat_epochs: 30
  # 温和衰减终点学习率比例（lr = decay_end_factor * base_lr）[仅 lr_schedule=flat_decay 时生效]
  decay_end_factor: 0.2
  
  # 批量大小
  batch_size_labeled: 5
  batch_size_unlabeled: 5
  # 无标签采样限制（0=不限制）
  unlabeled_samples_per_epoch: 250
  
  # 保存 checkpoints
  save_checkpoints: true
  # checkpoint 与监控推理间隔（epoch 数）
  checkpoint_interval: 5
  
  # 训练监控推理（保存语义+边界概率图演进）
  monitor:
    # 监控图像目录（相对 project_root）
    image_dir: "data/test"
    # 监控图像数量
    num_images: 10
    # 监控输出目录
    output_dir: "outputs/stage2/monitor"
    
  # Random Patch Masking 参数
  patch_mask_ratio: 0.5
  patch_mask_size: 64
  num_patches: 12
  # 掩码区域损失权重配置（控制遮挡区域在无监督损失中的贡献）
  # 语义通道：低频面状特征，鼓励从上下文推断，默认加倍
  seg_mask_region_weight: 1.5
  # 边界通道：高频线状特征，防止圆斑过拟合，默认降权
  boundary_mask_region_weight: 1.0
  
  # 边界锚点配置（Stage-1 冻结模型提供稳定边界伪标签，替代硬门控）
  boundary_anchor:
    # 是否启用 Stage-1 锚点 + EMA 渐进混合（false 时纯教师伪标签）
    enabled: true
    # Stage-1 锚点权重下限（始终保留锚点防止边界头崩塌）
    anchor_floor: 0.3
    # 从 1.0 衰减到 anchor_floor 的 epoch 数
    anchor_ramp_epochs: 20

  # 边界一致性损失配置（梯度感知：MSE + Sobel 梯度一致性 + 各向异性 TV）
  # 动机：旧 BCE 软目标+温度锐化+pos_weight 链路像素级独立，缺乏空间结构约束，
  # 多轮训练后边界头展现雾状热力图。Sobel 约束空间梯度一致，TV 抑制非边界区噪声。
  boundary_consistency:
    # Sobel 梯度一致性损失权重（约束学生与教师在空间梯度结构上一致）
    # 目标在背景区梯度为 0，Sobel 会把学生输出的凸起压平；
    # 此前权重过高是输出区间被压缩的原因之一，调低以保留边界幅度
    sobel_weight: 0.5
    # 各向异性 TV 正则化权重（非边界区强惩罚去雾，边界区弱惩罚保锐）
    tv_weight: 0.05
    # TV 中边界区域膨胀半径（px），用于区分边界区/非边界区
    tv_dilate_radius: 2
    # 非边界区域 TV 权重（越大越强抑制雾状噪声）
    tv_bg_weight: 1.0
    # 边界区域 TV 权重（越小越保留锐利边缘）
    tv_boundary_weight: 0.1
    # 背景抑制损失权重（非边界区学生预测 L1 惩罚，直接压向零）
    # 过高会把"全零/低值输出"变成稳定吸引子（下压力 > 正样本抬升力），
    # 这是边界输出区间被压缩的根本原因之一，务必保持低权重
    bg_suppress_weight: 0.2
    # 背景抑制阈值（目标伪标签低于此值视为背景区域）
    bg_suppress_threshold: 0.05
    # 正样本像素加权：目标 > 0.5 的像素在一致性损失中额外放大
    # （直接扭转稀疏正样本 vs 大面积背景的梯度平衡）
    # 5.0 会把最强的少数像素先推到饱和（max=0.999）而不是抬起整条边界带，
    # 降到 3.0 配合 margin 的区域级拉升
    pos_weight: 3.0
    # 边界-背景 margin 损失：约束"边界像素均值 − 背景像素均值 ≥ margin"，
    # 直接拉开学生输出的边界/背景差值（当前症状为差值 < 0.4）
    margin_loss_weight: 1.0
    margin: 0.4
    # 预测正样本占比上限正则：学生预测均值超过"目标占比 + rate_slack"时
    # 产生 hinge 惩罚，直接阻止边界概率空间扩散（>0.5 占比膨胀到 30%+ 的失效模式）。
    # 与 margin（往上拉）互补：margin 拉开对比，该正则封住扩散。
    rate_regularizer_weight: 0.2
    rate_slack: 0.05

  # 冻结开关（单独训练某个分支）
  # 用于解决语义头和边界头统一参数不匹配导致的训练困难
  # 两个都为 false 时维持联合训练（默认行为）
  freeze:
    # 冻结语义分支（seg_fpn + seg_branch），仅训练边界分支
    seg_branch: true
    # 冻结边界分支（boundary_fpn + boundary_branch），仅训练语义分支
    boundary_branch: false

  # 骨架过滤配置（教师边界伪标签形态学精炼）
  # 在教师输出边界概率后、与 Stage-1 锚点混合前，施加骨架化+膨胀，
  # 去除弥散噪声和拓扑毛刺，使边界伪标签更锐利、更拓扑合理。
  # 仍属无监督范畴（形态学先验，不使用 GT 标签）。
  skeleton_filter:
    # 是否启用骨架过滤
    enabled: true
    # 二值化阈值（概率图 > threshold 视为边界）
    # Stage-1 输出为"雾状宽带"（>0.3 约占 30-40%），0.4 会把大片雾判为正样本，
    # 教出宽边界；提高到 0.5 只保留结构核心，目标带更细更准。
    threshold: 0.5
    # 阈值随训练逐步提高（threshold -> threshold_end，线性 ramp）：
    # 早段低阈值多捕获弱边界（保 recall）；晚段模型输出变强后，高阈值
    # 剔除 Stage-1 伪标签中的噪声分支，治"雾状背景先被抑制后又复现"。
    threshold_end: 0.7
    threshold_ramp_epochs: 60
    # 骨架膨胀宽度（最终边界宽度 = 2*width+1 px）
    # 在"雾状源头"下目标带越宽学生越容易学到扩散，回归到 1（更细的目标带）
    dilate_width: 1
    # 高斯模糊 sigma（0=硬二值目标，>0=软目标，保留梯度信息）
    blur_sigma: 0.01

# -----------------------------------------------------------------------------
# 渐进式外观增强配置（Stage 2: 学生模型输入专用）
# -----------------------------------------------------------------------------
# 解决训练集与测试集在清晰度、亮度等方面的域差异。
# 仅对学生模型输入施加，教师模型始终收到干净数据。
# 增强概率随 epoch 从 0 线性增长到 max_prob，之后维持高位。
progressive_aug:
  # 是否启用渐进式外观增强
  enabled: true
  # 增强起始 epoch（之前 prob=0）
  start_epoch: 5
  # 线性增长期长度（epoch 数）
  ramp_epochs: 20
  # 最终增强概率（达到 ramp_end 后维持）
  max_prob: 0.8
  # 亮度抖动范围（乘法因子）
  brightness_range: [0.6, 1.4]
  # 对比度抖动范围（乘法因子）
  contrast_range: [0.6, 1.4]
  # 锐度抖动范围（负=模糊, 正=锐化, 基于 unsharp mask）
  sharpness_range: [-0.5, 1.0]
  # 高斯噪声标准差（0=禁用）
  gaussian_noise_std: 0.01
