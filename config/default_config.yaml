# =============================================================================
# 低碳钢金相图像相区分割 - 主配置
# =============================================================================
# python 环境: conda activate sam2_env
# 架构变更：语义 + 晶界边界预测；可选增加中心热图实例种子 + 离线边界净化

# -----------------------------------------------------------------------------
paths:
  # 自动解析为当前仓库根目录；也可用 SEGMENTATION_PROJECT_ROOT 临时覆盖。
  project_root: auto
  raw_data_dir: "data/raw"
  weights_dir: "weights"
  sam2_ckpt: "sam2_hiera_base_plus.pt"
  output_dir: "outputs/stage1"

# -----------------------------------------------------------------------------
sam2:
  model_version: "sam2_hiera_base_plus"
  config_file: "configs/sam2/sam2_hiera_b+.yaml"
  device: "cuda"
  freeze: true
  sam2_repo_path: "segment-anything-2"

# -----------------------------------------------------------------------------
# FPN 解码头配置（默认输出 2 通道；center_head=true 时增加中心热图通道）
# -----------------------------------------------------------------------------
decoder:
  fpn_channels: 256
  num_classes: 2          # 通道0=语义(0珠光体/1铁素体), 通道1=边界
  dropout: 0.1
  use_bn: true
  # 默认使用当前目检更可靠的 V6 双 FPN 基线；实验性高分辨率细化头在
  # config/experiments/ 下单独开启，避免架构与 checkpoint 隐式错配。
  boundary_refine: false
  center_head: false

# -----------------------------------------------------------------------------
data:
  image_size: 1024
  crop_size: 512
  center_sigma: 4.0
  erode_pixels: 5
  dist_scale_factor: 10.0
  classes:
    0: "pearlite"
    1: "ferrite"
  train_ratio: 0.8
  seed: 42
  batch_size: 4
  num_workers: 8
  augmentation:
    horizontal_flip: true
    vertical_flip: true
    rotation: true

# -----------------------------------------------------------------------------
train:
  learning_rate: 1.5e-4
  weight_decay: 1.0e-4
  epochs: 100
  warmup_epochs: 25
  grad_clip: 1.0
  amp: false
  focal_gamma: 2.0
  focal_alpha: 0.75
  boundary_alpha: 3.0
  center_weight: 0.0
  center_gamma: 2.0
  # 语义监督 Dice 权重（0=关闭）：块状低频结构，BCE 对掩码边界易钝；
  # 已改为两类平均 Dice（对珠光体/铁素体对称，见 utils/loss.py）；
  # 语义阶段（freeze.seg_branch=false）建议 0.3~0.5
  seg_dice_weight: 0.3
  # 复合评分权重（best_model 保存依据）
  composite_sem_weight: 0.2
  composite_boundary_weight: 0.8
  save_checkpoints: true

# -----------------------------------------------------------------------------
boundary:
  gt_dir: "data/purified_gt"
  purify_erode_radius: 2
  purify_dilate_width: 2
  purify_canny_low: 30
  purify_canny_high: 100
  edt_scale_factor: 10.0
  edt_weight_floor: 1.0
  edt_weight_ceil: 4.0

# -----------------------------------------------------------------------------
inference:
  test_dir: "data/test"
  output_dir: "outputs/inference"
  threshold: 0.5
  min_instance_area: 300
  max_instance_id: 255
  # 单阈值二值化（已移除 Canny 式滞后）：边界概率在邻域连续，滞后会把强脊
  # 的坡脚也纳入，导致边界带宽度沿脊线变化、轮廓崎岖不平，影响分水岭防线。
  # 0.4 为与旧滞后(0.4/0.5)实例密度相当的等效档；想要更细的线可 0.5，
  # 或配 boundary_logit_scale 1.3 保密度
  boundary_threshold: 0.35
  # 推理时对边界 logits 乘系数再 sigmoid（>1 增强弱响应，默认 1.0 不缩放）
  boundary_logit_scale: 1.0
  # 语义边缘升权（0=关闭）：边界概率 × (1 + α×|∇语义概率|)，
  # 相界（铁素体↔珠光体交界）处边界增强，相内噪声不被放大
  sem_edge_boost_alpha: 0.0
  # 语义补缺式融合（0=关闭）：final = bnd + λ·edge·(1−bnd)，
  # 只在边界分支弱处补语义梯度（不增厚强边界，避免小晶粒被吞并），
  # 补回边界分支漏检的铁素体内部晶界（语义热力图在晶界处凹陷）
  sem_edge_merge_weight: 0.0
  # 语义边缘模式：gradient=|∇seg|（双峰，简单）/ valley=-∇²seg（单峰，少重影）
  sem_edge_mode: "valley"
  # 语义边缘图高斯平滑 sigma（二阶 valley 模式对噪声敏感，必须平滑）
  sem_edge_smooth: 1.0
  # 双峰桥接（骨架化前膨胀 boundary_mask，默认 1px）：
  # 把"双脊"边界合成一条带，骨架取中轴 -> 平滑单线（治重影/粗糙骨架）
  # 推理 TTA（hflip/vflip/rot180 平均），提升弱边界召回与稳定性
  tta: false
  watershed_dilate_width: 1
  bridge_width: 1             # 骨架化前膨胀（桥接双线成单线）
  checkpoint_stage: "stage2"
  stage1_checkpoint: "outputs/stage1/best_model.pth"
  stage2_checkpoint: "outputs/stage2_v6/best_model_stage2.pth"
  center_seeds: false
  center_threshold: 0.25
  center_nms_kernel: 9

# -----------------------------------------------------------------------------
lora:
  enabled: true
  rank: 16
  alpha: 32.0
  target_layers: ["attn.qkv", "attn.proj"]
  lr_ratio: 2.0              # LoRA lr = base_lr × ratio
  init_from: ""              # 自监督预训练 LoRA 状态路径（留空=随机）
  freeze: true               # V6 参考权重中的 LoRA 保持冻结

# -----------------------------------------------------------------------------
post_process:
  interpolate_mode: "bilinear"
  align_corners: true
  connectivity: 8
  min_noise_area: 50
  save_visualization: false

# -----------------------------------------------------------------------------
semi_supervised:
  # Stage 2 的明确初始化锚点；优先于历史 inference.stage1_checkpoint。
  base_checkpoint: "outputs/stage2_v6/best_model_stage2.pth"
  unlabeled_dir: "data/unlabeled"
  output_dir: "outputs/stage2"
  init_from_checkpoint: ""
  ema_decay: 0.999
  adaptive_ema: true
  boundary_teacher_mode: "stage1_direct"   # ema / stage1_direct / self_consistency / anchor_self
  use_cached_pseudo_labels: true
  pseudo_label_cache_dir: "outputs/pseudo_labels/semantic_boundary"
  unsup_weight: 0.3          # 边界一致性权重（调高=无标签边界监督更强）
  unsup_seg_weight: 0.0      # 语义一致性权重（当前语义只走监督）
  unsup_rampup_epochs: 10
  epochs: 100
  learning_rate: 5.0e-5
  seg_lr_ratio: 0.3
  boundary_lr_ratio: 1.0
  lr_schedule: "flat_decay"  # flat_decay / cosine
  warmup_epochs: 5
  warmup_start_factor: 0.01
  cosine_end_factor: 0.0
  flat_epochs: 50
  decay_end_factor: 0.4
  batch_size_labeled: 4
  batch_size_unlabeled: 4
  unlabeled_samples_per_epoch: 250
  save_checkpoints: true
  checkpoint_interval: 5
  monitor:
    image_dir: "data/test"
    num_images: 10
    output_dir: "outputs/stage2/monitor"
  patch_mask_ratio: 0.2
  patch_mask_size: 160
  num_patches: 8
  seg_mask_region_weight: 1.0
  boundary_mask_region_weight: 1.0
  boundary_anchor:
    enabled: true
    anchor_floor: 0.5
    anchor_ramp_epochs: 20
  boundary_consistency:
    sobel_weight: 0.5
    tv_weight: 0.05
    tv_dilate_radius: 2
    tv_bg_weight: 1.0
    tv_boundary_weight: 0.1
    bg_suppress_weight: 0.2
    bg_suppress_threshold: 0.05
    pos_weight: 3.0
    margin_loss_weight: 1.0
    margin: 0.4
    peak_hinge_weight: 0.5
    peak_threshold: 0.8
    rate_regularizer_weight: 0.2
    rate_regularizer_weight_end: 0.2
    rate_regularizer_ramp_epochs: 0
    rate_slack: 0.03
  freeze:
    seg_branch: false
    boundary_branch: false
  sem_boundary_align_weight: 0.0
  sem_degrade_warn_factor: 0.9
  skeleton_filter:
    enabled: true
    threshold: 0.5
    threshold_end: 0.5
    threshold_ramp_epochs: 60
    dilate_width: 1
    blur_sigma: 0.01

# -----------------------------------------------------------------------------
progressive_aug:
  enabled: true
  start_epoch: 5
  ramp_epochs: 20
  max_prob: 0.8
  brightness_range: [0.55, 1.45]
  contrast_range: [0.45, 1.45]
  sharpness_range: [-0.5, 1.0]
  gaussian_noise_std: 0.015
