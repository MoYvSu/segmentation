# =============================================================================
# 低碳钢金相图像无监督相区分割 - 全局配置（边界预测版本）
# =============================================================================
# python 环境: conda activate sam2_env
# 架构变更：双通道边界预测（语义掩码 + 晶界掩码）+ 离线边界净化

# -----------------------------------------------------------------------------
# 路径配置
# -----------------------------------------------------------------------------
paths:
  project_root: &project_root "d:/MY_PROGRAMME/segmentationv2"
  raw_data_dir: "data/raw"
  weights_dir: "weights"
  sam2_ckpt: "sam2_hiera_base_plus.pt"
  output_dir: "outputs/stage1"
  pseudo_label_dir: "outputs/pseudo_labels"
  active_learning_log: "outputs/active_learning_log.csv"

# -----------------------------------------------------------------------------
# SAM 2 Encoder 配置
# -----------------------------------------------------------------------------
sam2:
  model_version: "sam2_hiera_base_plus"
  config_file: "configs/sam2/sam2_hiera_b+.yaml"
  device: "cuda"
  freeze: true
  sam2_repo_path: "segment-anything-2"

# -----------------------------------------------------------------------------
# FPN 解码头配置（边界预测版本：输出 2 通道 = 语义 logits + 边界 logits）
# -----------------------------------------------------------------------------
decoder:
  fpn_channels: 256
  num_classes: 2
  dropout: 0.1
  use_bn: true

# -----------------------------------------------------------------------------
# 数据管道配置
# -----------------------------------------------------------------------------
data:
  image_size: 1024
  crop_size: 512
  erode_pixels: 5
  dist_scale_factor: 10.0
  classes:
    0: "pearlite"
    1: "ferrite"
  train_ratio: 0.8
  seed: 42
  batch_size: 4
  num_workers: 4
  augmentation:
    horizontal_flip: true
    vertical_flip: true
    rotation: true

# -----------------------------------------------------------------------------
# 训练配置
# -----------------------------------------------------------------------------
train:
  learning_rate: 1.5e-4
  weight_decay: 1.0e-4
  epochs: 100
  scheduler: "cosine"
  warmup_epochs: 25
  grad_clip: 1.0
  amp: false
  focal_gamma: 2.0
  focal_alpha: 0.75
  boundary_alpha: 1.5
  # 复合评分权重（best_model 保存依据）
  composite_sem_weight: 0.2
  composite_boundary_weight: 0.8
  save_checkpoints: true

# -----------------------------------------------------------------------------
# 边界净化与 EDT 权重配置
# -----------------------------------------------------------------------------
boundary:
  gt_dir: "data/purified_gt"
  purify_erode_radius: 2
  purify_dilate_width: 2
  purify_canny_low: 30
  purify_canny_high: 100
  edt_scale_factor: 10.0
  edt_weight_floor: 1.0
  edt_weight_ceil: 4.0

# -----------------------------------------------------------------------------
# 推理配置
# -----------------------------------------------------------------------------
inference:
  test_dir: "data/test"
  output_dir: "outputs/inference"
  threshold: 0.5
  min_instance_area: 500
  max_instance_id: 255
  boundary_threshold: 0.05
  watershed_dilate_width: 2
  checkpoint_stage: "stage2"
  stage1_checkpoint: "outputs/stage1/best_model.pth"
  stage2_checkpoint: "outputs/stage2/stage2_epoch80.pth"

# -----------------------------------------------------------------------------
# 主动学习配置
# -----------------------------------------------------------------------------
active_learning:
  strategy: "entropy"
  sample_size: 10
  entropy_threshold: 0.5
  boundary_variance_threshold: 0.1

# -----------------------------------------------------------------------------
# 后处理配置
# -----------------------------------------------------------------------------
post_process:
  interpolate_mode: "bilinear"
  align_corners: true
  connectivity: 8
  min_noise_area: 50
  save_visualization: false

# -----------------------------------------------------------------------------
# 半监督配置（Stage 2: Mean Teacher）
# -----------------------------------------------------------------------------
semi_supervised:
  # 无标注数据目录
  unlabeled_dir: "data/unlabeled"
  # 输出目录（第二阶段 checkpoints）
  output_dir: "outputs/stage2"
  # EMA 衰减系数
  ema_decay: 0.999
  # 无监督损失权重
  unsup_weight: 1.0
  # 训练轮数
  epochs: 50
  # 学习率
  learning_rate: 5.0e-5
  # FPN 组件学习率比例（FPN lr = fpn_lr_ratio * learning_rate）
  fpn_lr_ratio: 0.1
  # warmup 轮数
  warmup_epochs: 5
  # 批量大小
  batch_size_labeled: 4
  batch_size_unlabeled: 4
  # 无标签采样限制（0=不限制）
  unlabeled_samples_per_epoch: 0
  # 保存 checkpoints
  save_checkpoints: true
  # checkpoint 与监控推理间隔（epoch 数）
  checkpoint_interval: 5
  # 训练监控推理（保存语义+边界概率图演进）
  monitor:
    # 监控图像目录（相对 project_root）
    image_dir: "data/test"
    # 监控图像数量
    num_images: 3
    # 监控输出目录
    output_dir: "outputs/stage2/monitor"
  # Random Patch Masking 参数
  patch_mask_ratio: 0.3
  patch_mask_size: 64
  num_patches: 8
  # 边界伪标签硬门控截断（防止雾状区域冲刷边界头）
  boundary_gate:
    # 是否启用硬门控 + Focal Loss（false 时回退到原 MSE）
    enabled: true
    # 正样本阈值：teacher_boundary_prob > 此值 → 伪标签=1
    positive_threshold: 0.7
    # 负样本阈值：teacher_boundary_prob < 此值 → 伪标签=0
    negative_threshold: 0.1
    # Focal Loss 聚焦参数
    focal_gamma: 2.0
    # Focal Loss 正样本权重（alpha=0.75 上调正样本，稀释负样本）
    focal_alpha: 0.75

# -----------------------------------------------------------------------------
# 渐进式外观增强配置（Stage 2: 学生模型输入专用）
# -----------------------------------------------------------------------------
# 解决训练集与测试集在清晰度、亮度等方面的域差异。
# 仅对学生模型输入施加，教师模型始终收到干净数据。
# 增强概率随 epoch 从 0 线性增长到 max_prob，之后维持高位。
progressive_aug:
  # 是否启用渐进式外观增强
  enabled: true
  # 增强起始 epoch（之前 prob=0）
  start_epoch: 0
  # 线性增长期长度（epoch 数）
  ramp_epochs: 10
  # 最终增强概率（达到 ramp_end 后维持）
  max_prob: 0.8
  # 亮度抖动范围（乘法因子）
  brightness_range: [0.6, 1.4]
  # 对比度抖动范围（乘法因子）
  contrast_range: [0.6, 1.4]
  # 锐度抖动范围（负=模糊, 正=锐化, 基于 unsharp mask）
  sharpness_range: [-0.5, 1.0]
  # 高斯噪声标准差（0=禁用）
  gaussian_noise_std: 0.01
