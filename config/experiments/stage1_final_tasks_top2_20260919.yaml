# -*- coding: utf-8 -*-
_base: ../train/stage1_final_geometry120_20260919.yaml

affinity_geometry_g1:
  geometry_init_checkpoint: outputs/20260919_stage1_final_tasks/geometry/best_affinity.pth

affinity_deployment:
  checkpoint: outputs/20260919_stage1_final_tasks/geometry/best_affinity.pth
  fusion_mode: gated
  short_reduction: top2
  distance2_weight: 0.50
  distance4_weight: 0.25
  support_threshold: 0.20
  support_temperature: 0.05
  short_softmax_temperature: 0.15

semantic_challenger:
  enabled: true
  checkpoint: outputs/20260919_stage1_final_tasks/semantic/best_model_stage2.pth
  replace_reference_semantic: true

inference:
  boundary_threshold: 0.65
  marker_border_seal_width: 2
  marker_boundary_low_threshold: 0.45
  marker_boundary_reconstruction_steps: 8
  semantic_vote_mode: probability_mean
  output_dir: outputs/20260919_stage1_final_tasks/deployment

post_process:
  save_visualization: false
