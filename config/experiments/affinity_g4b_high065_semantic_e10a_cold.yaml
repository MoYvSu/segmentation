# Fixed V6/G4b foreground and affinity geometry; E10a is classifier-only.
_base: ../inference/final_affinity_g4b_high065.yaml

decoder:
  semantic_residual: true
  semantic_residual_version: highres_v1
  semantic_residual_hidden: 64
  semantic_residual_color_channels: 16
  semantic_residual_half_channels: 48
  semantic_residual_full_channels: 24
  semantic_residual_use_photometric: true
  semantic_residual_max_logit_delta: 2.0

semantic_challenger:
  enabled: true
  checkpoint: outputs/stage2_semantic_e10a_cold20/best_model_stage2.pth

inference:
  output_dir: outputs/submission_affinity_g4b_high065_semantic_e10a_cold
  semantic_vote_mode: probability_mean
  semantic_vote_erode_width: 0
