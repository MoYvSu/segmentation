paths:
  project_root: auto
sam2:
  model_version: sam2_hiera_base_plus
  config_file: configs/sam2/sam2_hiera_b+.yaml
  device: cuda
  freeze: true
  sam2_repo_path: segment-anything-2
decoder:
  fpn_channels: 256
  num_classes: 2
  dropout: 0.1
  use_bn: true
  boundary_refine: false
  center_head: false
data:
  image_size: 1024
  crop_size: 512
  center_sigma: 4.0
  erode_pixels: 5
  dist_scale_factor: 10.0
  classes:
    0: pearlite
    1: ferrite
  train_ratio: 0.8
  seed: 42
  batch_size: 4
  num_workers: 8
  augmentation:
    horizontal_flip: true
    vertical_flip: true
    rotation: true
train:
  learning_rate: 0.00015
  weight_decay: 0.0001
  epochs: 100
  warmup_epochs: 25
  grad_clip: 1.0
  amp: false
  focal_gamma: 2.0
  focal_alpha: 0.75
  boundary_alpha: 3.0
  center_weight: 0.0
  center_gamma: 2.0
  seg_dice_weight: 0.3
  composite_sem_weight: 0.2
  composite_boundary_weight: 0.8
  save_checkpoints: true
boundary:
  purify_erode_radius: 2
  purify_dilate_width: 2
  purify_canny_low: 30
  purify_canny_high: 100
  edt_scale_factor: 10.0
  edt_weight_floor: 1.0
  edt_weight_ceil: 4.0
inference:
  threshold: 0.5
  min_instance_area: 50
  max_instance_id: 65535
  boundary_threshold: 0.35
  boundary_logit_scale: 1.0
  sem_edge_boost_alpha: 0.0
  sem_edge_merge_weight: 0.0
  sem_edge_mode: valley
  sem_edge_smooth: 1.0
  tta: false
  quality_aware:
    enabled: false
    weak_min_flags: 2
    thresholds:
      brightness_low: 0.58
      contrast_low: 0.14
      sharpness_low: 0.02
      sharpness_critical: 0.008
      color_cast_high: 0.04
    enhanced_weight: 0.35
    enhanced_tta: false
    boundary_threshold_offsets:
      standard: 0.0
      weak: -0.02
    boundary_threshold_limits:
    - 0.25
    - 0.5
    enhance:
      white_balance: true
      white_balance_gain_limit: 0.12
      gamma: true
      target_brightness: 0.65
      gamma_min: 0.75
      gamma_max: 1.25
      clahe: true
      clahe_clip: 1.5
      unsharp: true
      unsharp_sigma: 1.0
      unsharp_amount: 0.35
  watershed_dilate_width: 1
  bridge_width: 1
  marker_border_seal_width: 0
  marker_boundary_low_threshold: null
  marker_boundary_reconstruction_steps: 0
  semantic_vote_mode: hard_majority
  semantic_vote_erode_width: 0
  semantic_vote_threshold: 0.5
  checkpoint_stage: stage2
  center_seeds: false
  center_threshold: 0.25
  center_nms_kernel: 9
lora:
  enabled: true
  rank: 16
  alpha: 32.0
  target_layers:
  - attn.qkv
  - attn.proj
  lr_ratio: 2.0
  freeze: true
post_process:
  interpolate_mode: bilinear
  align_corners: true
  connectivity: 8
  min_noise_area: 50
  save_visualization: true
semi_supervised:
  ema_decay: 0.999
  adaptive_ema: true
  boundary_teacher_mode: stage1_direct
  use_cached_pseudo_labels: true
  unsup_weight: 0.3
  unsup_seg_weight: 0.0
  unsup_rampup_epochs: 10
  epochs: 100
  learning_rate: 5.0e-05
  seg_lr_ratio: 0.3
  boundary_lr_ratio: 1.0
  lr_schedule: flat_decay
  warmup_epochs: 5
  warmup_start_factor: 0.01
  cosine_end_factor: 0.0
  flat_epochs: 50
  decay_end_factor: 0.4
  batch_size_labeled: 4
  batch_size_unlabeled: 4
  unlabeled_samples_per_epoch: 250
  save_checkpoints: true
  checkpoint_interval: 5
  monitor:
    num_images: 10
  patch_mask_ratio: 0.2
  patch_mask_size: 160
  num_patches: 8
  seg_mask_region_weight: 1.0
  boundary_mask_region_weight: 1.0
  boundary_anchor:
    enabled: true
    anchor_floor: 0.5
    anchor_ramp_epochs: 20
  boundary_consistency:
    sobel_weight: 0.5
    tv_weight: 0.05
    tv_dilate_radius: 2
    tv_bg_weight: 1.0
    tv_boundary_weight: 0.1
    bg_suppress_weight: 0.2
    bg_suppress_threshold: 0.05
    pos_weight: 3.0
    margin_loss_weight: 1.0
    margin: 0.4
    peak_hinge_weight: 0.5
    peak_threshold: 0.8
    rate_regularizer_weight: 0.2
    rate_regularizer_weight_end: 0.2
    rate_regularizer_ramp_epochs: 0
    rate_slack: 0.03
  freeze:
    seg_branch: false
    boundary_branch: false
  sem_boundary_align_weight: 0.0
  sem_degrade_warn_factor: 0.9
  skeleton_filter:
    enabled: true
    threshold: 0.5
    threshold_end: 0.5
    threshold_ramp_epochs: 60
    dilate_width: 1
    blur_sigma: 0.01
progressive_aug:
  enabled: true
  start_epoch: 5
  ramp_epochs: 20
  max_prob: 0.8
  brightness_range:
  - 0.55
  - 1.45
  contrast_range:
  - 0.45
  - 1.45
  sharpness_range:
  - -0.5
  - 1.0
  gaussian_noise_std: 0.015
affinity_geometry_g1:
  input_size: 1024
  output_grid: 512
  fpn_channels: 256
  up_channels: 128
  seed: 42
  val_fraction: 0.2
  forced_train_names:
  - train_001
  - train_002
  unlabeled_monitor_count: 0
  batch_size: 2
  epochs: 120
  learning_rate: 0.0001
  min_learning_rate: 5.0e-06
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  semantic_tolerance: 1.0e-06
  monitor_interval: 120
  graph_thresholds:
  - 0.2
  - 0.2
  - 0.2
  - 0.2
  - 0.25
  - 0.25
  - 0.6
  - 0.6
  deployment_validation:
    enabled: false
    fusion_mode: gated
    short_reduction: mean
    boundary_threshold: 0.55
    distance2_weight: 0.5
    distance4_weight: 0.25
    support_threshold: 0.2
    support_temperature: 0.05
    short_softmax_temperature: 0.15
  augmentation:
    horizontal_flip: true
    vertical_flip: true
    rotation90: true
    brightness: 0.12
    contrast: 0.12
    gamma: 0.12
    noise_probability: 0.25
    noise_std: 0.01
    blur_probability: 0.1
    crop_probability: 0.5
    crop_scale_min: 0.65
    crop_scale_max: 0.9
  sam2_geometry:
    enabled: true
    dataset_dir: data/sam2_geometry_g2
    source_dir: data/unlabeled
    pseudo_fraction: 0.5
    samples_per_epoch: 52
    use_eroded_interiors: false
  loss:
    negative_weight: 1.5
    hard_negative_weight: 1.0
    hard_negative_gamma: 2.0
    normalize_edge_weights: true
  selection_metric: val_affinity_loss
  expected_val_names:
  - train_172
  - train_176
  - train_349
  - train_623
  - train_873
  - train_888
  num_workers: 0
  geometry_init_mode: reference_boundary_fpn
  fpn_learning_rate: 5.0e-05
