  purify_erode_radius: 2
  purify_dilate_width: 2
  purify_canny_low: 30
  purify_canny_high: 100
  edt_scale_factor: 10.0
  edt_weight_floor: 1.0
  edt_weight_ceil: 4.0
inference:
  output_dir: outputs/20260919_unified_alignment/deployment
  threshold: 0.5
  min_instance_area: 50
  max_instance_id: 65535
  boundary_threshold: 0.65
  boundary_logit_scale: 1.0
  sem_edge_boost_alpha: 0.0
  sem_edge_merge_weight: 0.0
  sem_edge_mode: valley
  sem_edge_smooth: 1.0
  tta: false
  quality_aware:
    enabled: false
    weak_min_flags: 2
    thresholds:
      brightness_low: 0.58
      contrast_low: 0.14
      sharpness_low: 0.02
      sharpness_critical: 0.008
      color_cast_high: 0.04
    enhanced_weight: 0.35
    enhanced_tta: false
    boundary_threshold_offsets:
      standard: 0.0
      weak: -0.02
    boundary_threshold_limits:
    - 0.25
    - 0.5
    enhance:
      white_balance: true
      white_balance_gain_limit: 0.12
      gamma: true
      target_brightness: 0.65
      gamma_min: 0.75
      gamma_max: 1.25
