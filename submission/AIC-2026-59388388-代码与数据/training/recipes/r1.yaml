  enabled: true
  rank: 16
  alpha: 32.0
  target_layers:
  - attn.qkv
  - attn.proj
  lr_ratio: 2.0
  init_from: ''
  freeze: true
post_process:
  interpolate_mode: bilinear
  align_corners: true
  connectivity: 8
  min_noise_area: 50
  save_visualization: false
semi_supervised:
