  config_file: configs/sam2/sam2_hiera_b+.yaml
  device: cuda
  freeze: true
  sam2_repo_path: segment-anything-2
decoder:
  fpn_channels: 256
  num_classes: 2
  dropout: 0.1
  use_bn: true
  boundary_refine: false
  center_head: false
data:
  image_size: 1024
  crop_size: 512
  center_sigma: 4.0
  erode_pixels: 5
  dist_scale_factor: 10.0
  classes:
    0: pearlite
    1: ferrite
  train_ratio: 0.8
  seed: 42
  batch_size: 4
  num_workers: 8
  augmentation:
    horizontal_flip: true
    vertical_flip: true
    rotation: true
train:
  learning_rate: 0.00015
  weight_decay: 0.0001
  epochs: 100
  warmup_epochs: 25
  grad_clip: 1.0
  amp: false
  focal_gamma: 2.0
  focal_alpha: 0.75
  boundary_alpha: 3.0
  center_weight: 0.0
  center_gamma: 2.0
  seg_dice_weight: 0.3
  composite_sem_weight: 0.2
  composite_boundary_weight: 0.8
  save_checkpoints: true
boundary:
